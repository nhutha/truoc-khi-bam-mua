<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trước Khi Bấm Mua — sản phẩm theo từng video</title>
<meta name="description" content="Sản phẩm liên quan từng video, kèm con số do chính hãng công bố và link trang thông số để bạn tự kiểm.">
<meta name="robots" content="index,follow">
<style>*{box-sizing:border-box}
body{margin:0;padding:0;background:#0B0E14;color:#E8EAED;
 font:16px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
.wrap{max-width:680px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:26px;line-height:1.25;margin:0 0 6px}
.sub{color:#9AA0A6;font-size:14px;margin:0 0 20px}
.cong-bo{background:#1A1F2B;border-left:3px solid #F5A524;border-radius:6px;
 padding:12px 14px;font-size:14px;color:#D6D9DE;margin:0 0 28px}
section{border-top:1px solid #222834;padding:24px 0 4px}
.so{display:inline-block;background:#222834;color:#9AA0A6;font-size:12px;
 letter-spacing:.08em;padding:3px 9px;border-radius:99px;margin-bottom:10px}
h2{font-size:20px;line-height:1.3;margin:0 0 10px}
.luat{background:#121722;border-radius:8px;padding:12px 14px;margin:0 0 18px;
 font-size:15px;color:#C9CDD3}
.luat b{color:#F5A524}
ol{list-style:none;counter-reset:sp;margin:0;padding:0}
ol li{counter-increment:sp;position:relative;padding:14px 0 14px 38px;
 border-bottom:1px solid #1C2230}
ol li:last-child{border-bottom:0}
ol li::before{content:counter(sp);position:absolute;left:0;top:14px;width:26px;
 height:26px;border-radius:99px;background:#222834;color:#9AA0A6;
 font-size:13px;text-align:center;line-height:26px}
.ten{font-weight:600;display:block;margin-bottom:4px}
.so-lieu{font-size:14px;color:#9AA0A6;margin-bottom:8px}
.so-lieu b{color:#5BC97A}
a{color:#6AA9FF;text-decoration:none}
a:hover{text-decoration:underline}
.mua{display:inline-block;background:#F5A524;color:#0B0E14;font-weight:600;
 font-size:14px;padding:8px 16px;border-radius:6px;margin-right:10px}
.nguon{font-size:13px;white-space:nowrap}
footer{border-top:1px solid #222834;margin-top:32px;padding-top:20px;
 font-size:13px;color:#6B7280}
/* Duoi 480px: hai link khong du cho tren mot hang, mui tien se rot xuong mot
   minh trong xau. Cho link nguon xuong hang rieng. */
@media(max-width:480px){
 h1{font-size:22px}h2{font-size:18px}
 .mua{display:block;text-align:center;margin:0 0 10px}
 .nguon{display:block}
}</style>
</head>
<body>
  <div class="wrap">
    <h1>Trước Khi Bấm Mua</h1>
    <p class="sub">@truockhibammua · Sản phẩm theo từng video</p>
    <section>
      <p class="luat">Chưa có video nào kèm sản phẩm. Mục này cập nhật theo từng video — mỗi video 5 sản phẩm mà <b>chính hãng</b> công bố đúng con số video nói tới.</p>
    </section>
    <footer>@truockhibammua · Kênh giải thích thông số và chỉ ra thứ không đáng trả tiền.</footer>
  </div>
</body>
</html>
